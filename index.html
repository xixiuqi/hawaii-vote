<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>夏威夷选点投票</title>
<meta name="description" content="12/5–12/13 茂宜 + 大岛行程选点投票">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
/* Layout: one narrow ballot column; numbered rows grouped by island; fixed tally bar at the bottom. */
:root{
  --paper:#F1F4F2; --card:#FFFFFF; --ink:#15232A; --muted:#5B6A6F; --line:#D8E0DE;
  --sea:#0A6B72; --sea-soft:#D5EBE9; --lava:#BF4626; --lava-soft:#F5DCD2;
  --stone:#8C989B; --stone-soft:#E7ECEB; --gold:#C2850F;
  --display:"Bricolage Grotesque", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
  --body:"PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1619; --card:#162125; --ink:#E4ECEB; --muted:#93A4A7; --line:#283A3F;
  --sea:#52B9BD; --sea-soft:#163638; --lava:#EE7D59; --lava-soft:#3A2119;
  --stone:#7D8D90; --stone-soft:#1F2C30; --gold:#E4AF48; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1619; --card:#162125; --ink:#E4ECEB; --muted:#93A4A7; --line:#283A3F;
  --sea:#52B9BD; --sea-soft:#163638; --lava:#EE7D59; --lava-soft:#3A2119;
  --stone:#7D8D90; --stone-soft:#1F2C30; --gold:#E4AF48; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 120px}
h1,h2,h3{margin:0;text-wrap:balance}
header{display:grid;gap:6px;padding-block:8px 18px}
.eyebrow{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sea)}
h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;letter-spacing:-.01em}
.dates{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px}
.maplink{justify-self:start;margin-top:4px;font-size:13.5px;font-weight:600;color:var(--sea);text-decoration:none;border-bottom:1px solid var(--sea-soft)}
.maplink:hover{border-bottom-color:var(--sea)}
.dates b{font-family:var(--display);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:4px;padding:4px;background:var(--stone-soft);border-radius:10px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 15px var(--body);padding:9px 0;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs .count{font-family:var(--display);font-variant-numeric:tabular-nums;margin-left:4px;color:var(--sea)}

.mode{font-size:13.5px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:10px;margin-bottom:16px}
.mode strong{color:var(--ink)}

.who{display:grid;gap:6px;margin-bottom:12px}
label.lbl{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],textarea{width:100%;box-sizing:border-box;font:16px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:4px 0 22px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}

.island{display:grid;gap:0;margin-bottom:26px}
.island-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:2px}
.island-h h2{font-family:var(--display);font-weight:800;font-size:22px}
.island-h span{font-family:var(--display);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.place{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.place .num{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1;color:var(--muted);font-variant-numeric:tabular-nums}
.place.has .num{color:var(--ink)}
.place.lv3 .num{color:var(--lava)}
.place .body{min-width:0;display:grid;gap:8px}
.place h3{font-size:16px;font-weight:650;line-height:1.35}
.detail{margin:0;font-size:13.5px;color:var(--muted)}
.flag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:99px;margin-right:6px;vertical-align:1px}
.flag.del{background:var(--stone-soft);color:var(--muted)}
.flag.warn{background:var(--lava-soft);color:var(--lava)}
.flag.free{background:var(--sea-soft);color:var(--sea)}
.place.deleted h3{color:var(--muted)}

.ctrl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--ink);font:600 13.5px var(--body);padding:7px 11px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"][data-w="3"]{background:var(--lava);color:#fff}
.seg button[aria-pressed="true"][data-w="2"]{background:var(--sea);color:#fff}
.seg button[aria-pressed="true"][data-w="1"]{background:var(--stone);color:#fff}
.seg button[aria-pressed="true"][data-w="0"]{background:var(--stone-soft);color:var(--muted);text-decoration:line-through}
.stars{display:flex;gap:1px}
.stars button{border:0;background:transparent;font-size:21px;line-height:1;padding:3px 2px;color:var(--line);cursor:pointer}
.stars button.on{color:var(--gold)}

.notebox{display:grid;gap:6px;margin-top:6px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));z-index:5}
.bar-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.prog{flex:1;min-width:0;display:grid;gap:2px}
.prog b{font-family:var(--display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.prog small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;border-radius:10px;background:var(--ink);color:var(--paper);font:700 14.5px var(--body);padding:11px 16px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.copyout{display:grid;gap:8px;margin:0 0 18px;padding:12px;border:1px solid var(--sea);border-radius:10px;background:var(--sea-soft)}
.copyout p{margin:0;font-size:13.5px}
.copyout textarea{min-height:150px;font-size:13.5px}

/* results */
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.voters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.r-row{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.r-row .num{font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums}
.r-row.top .num{color:var(--lava)}
.r-body{min-width:0;display:grid;gap:6px}
.r-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.r-head h3{font-size:15px;font-weight:650}
.r-score{font-family:var(--display);font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--gold)}
.r-score.none{color:var(--muted);font-weight:500}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--stone-soft)}
.stack i{display:block;height:100%}
.stack .s3{background:var(--lava)} .stack .s2{background:var(--sea)} .stack .s1{background:var(--stone)}
.stack .s0,.sw.s0{background:repeating-linear-gradient(45deg,var(--muted) 0 1.5px,transparent 1.5px 4px)}
.sw{display:inline-block;width:18px;height:10px;border-radius:3px;flex:none}
.sw.s3{background:var(--lava)} .sw.s2{background:var(--sea)} .sw.s1{background:var(--stone)} .sw.none{background:var(--stone-soft);box-shadow:inset 0 0 0 1px var(--line)}
.rlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:2px 0 6px}
.rlegend span{display:inline-flex;align-items:center;gap:6px}
.r-meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.r-meta .must{color:var(--lava);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.links a{color:var(--sea);text-decoration:none;border-bottom:1px solid var(--sea-soft)}
.links a:hover{border-bottom-color:var(--sea)}
.cbtn{border:1px solid var(--line);background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 10px;border-radius:8px;cursor:pointer}
.cbtn.has{color:var(--sea);border-color:var(--sea)}
textarea.cmt{min-height:0;font-size:14.5px;padding:8px 10px}
.cms{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:4px}
.cms li{font-size:13.5px;padding:6px 10px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow-wrap:anywhere}
.cms li b{margin-right:6px;color:var(--ink)}
.dec{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.dec b{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;margin-right:6px}
.dec.keep b,.plan-row.keep .tag{background:var(--sea);color:#fff}
.dec.maybe b,.plan-row.maybe .tag{background:var(--stone-soft);color:var(--ink)}
.dec.drop b,.plan-row.drop .tag{background:var(--lava-soft);color:var(--lava)}
.plan{display:grid;gap:10px;padding:14px;margin-bottom:20px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.plan-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plan-h h2{font-family:var(--display);font-weight:800;font-size:18px}
.plan-h span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.plan p{margin:0;font-size:14px}
.empty-plan p{color:var(--muted)}
.plan-row{display:grid;grid-template-columns:auto 1fr;gap:8px;font-size:13.5px;align-items:start}
.plan-row .tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.plan-days{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13.5px}
.plan-days b{margin-right:6px}
.plan-ask{padding:8px 10px;border-radius:8px;background:var(--sea-soft)}
.plan-foot{color:var(--muted);font-size:12.5px!important}
.claim{display:grid;gap:8px;padding:12px;margin-bottom:14px;border:1px solid var(--sea);border-radius:10px;background:var(--sea-soft)}
.claim p{margin:0;font-size:13.5px}
.claim .btn{justify-self:start}
.btn.sm{font-size:13px;padding:7px 12px;border-radius:8px}
.btn.danger{background:var(--lava);color:#fff}
.btn.ghost.danger{background:transparent;color:var(--lava);border-color:var(--lava-soft)}
.linkbtn{border:0;background:none;padding:0;font:600 12.5px var(--body);color:var(--sea);cursor:pointer}
.mine{display:grid;gap:8px;padding:12px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.mine-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:baseline}
.mine-h b{font-size:14.5px}
.mine-h span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mine p{margin:0;font-size:13px;color:var(--muted)}
.mine-act{display:flex;flex-wrap:wrap;gap:8px}
.confirm{display:grid;gap:8px;padding:10px;border-radius:10px;background:var(--sea-soft)}
.confirm.danger{background:var(--lava-soft)}
.confirm p{color:var(--ink)!important}
.risk{display:grid;gap:3px;padding:8px 10px;border-radius:9px;background:var(--lava-soft);color:var(--ink);font-size:13px;overflow-wrap:anywhere}
.risk b{color:var(--lava);font-size:12.5px}
.risk .more{color:var(--muted);font-size:12px}
.cbtn.warn{color:var(--lava);border-color:var(--lava)}
.thread{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.cmlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cmlist li{padding:7px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:13.5px;overflow-wrap:anywhere}
.cmlist li.r{border-color:var(--lava);background:var(--lava-soft)}
.cmlist li.none{color:var(--muted);background:transparent;border-style:dashed}
.cmlist p{margin:2px 0 0}
.cm-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:12.5px}
.cm-h b{font-size:13px}
.cm-t{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;margin-left:6px}
.cm-h .linkbtn{margin-left:auto;color:var(--lava)}
.rtag{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:99px;background:var(--lava);color:#fff}
.composer{display:grid;gap:6px}
.cmp-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px}
.rchk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--lava);font-weight:600;cursor:pointer}
.rchk input{width:16px;height:16px;accent-color:var(--lava)}
.feed{display:grid;gap:8px;padding:12px 14px;margin-bottom:18px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.feed h3{font-family:var(--display);font-weight:800;font-size:16px}
.feed ul{list-style:none;margin:0;padding:0 4px 0 0;display:grid;gap:6px;max-height:280px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.feed h3 small{font-family:var(--body,inherit);font-weight:500;font-size:12px;color:var(--muted);margin-left:6px}
.feed li{display:grid;grid-template-columns:76px 1fr;gap:8px;font-size:13px;overflow-wrap:anywhere}
.feed li.risk{background:var(--lava-soft);border-radius:8px;padding:4px 6px;margin:0 -6px}
.feed .ft{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px}
.feed .linkbtn{justify-self:start}
.editbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;margin-bottom:12px;border-radius:10px;background:var(--sea-soft);font-size:13.5px}
.r-meta.chg{color:var(--gold)}
.advice{display:grid;gap:8px;padding:12px 14px;margin-bottom:16px;border:1px solid var(--line);border-left:4px solid var(--sea);border-radius:10px;background:var(--card)}
.advice h3{font-family:var(--display);font-weight:800;font-size:16px}
.advice ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.advice li{font-size:13.5px;overflow-wrap:anywhere;white-space:pre-line}
.advice li b{margin-right:8px}
.advice li.r{background:var(--lava-soft);border-radius:8px;padding:6px 8px}
.advice p{margin:0;font-size:12.5px;color:var(--muted)}
body.noname #name{border-color:var(--lava);box-shadow:0 0 0 3px var(--lava-soft)}
body.noname .who .lbl{color:var(--lava)}
body.noname #status{color:var(--lava);font-weight:600}
body.noname #copyBtn{background:var(--lava);color:#fff}
.pstat{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:7px 10px;border-radius:9px;background:var(--stone-soft)}
.pstat .pk{flex:none;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--card);color:var(--muted);margin-top:1px}
.pstat .pt{min-width:0;overflow-wrap:anywhere}
.pstat .pt b{margin-right:6px;font-size:12px;color:var(--muted)}
.pstat a{color:var(--sea);font-weight:600;text-decoration:none;white-space:nowrap}
.pstat.keep .pk{background:var(--sea);color:#fff}
.pstat.change .pk{background:var(--gold);color:#fff}
.pstat.drop{background:var(--lava-soft)}
.pstat.drop .pk{background:var(--lava);color:#fff}
.place.plan-drop h3{color:var(--muted)}
.adv{display:grid;gap:6px;padding:9px 11px;border-radius:10px;background:var(--sea-soft)}
.adv.has-risk{background:var(--card);border:1px solid var(--lava)}
.adv-h{font-size:12px;color:var(--sea);letter-spacing:.04em}
.adv.has-risk .adv-h{color:var(--lava)}
.adv ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.adv li{font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.adv li b{margin-right:6px}
.adv li .rtag{margin-right:6px}
.adv li.r{background:var(--lava-soft);border-radius:7px;padding:5px 8px}
.adv .linkbtn{justify-self:start}
.sortnote{font-size:13px;color:var(--muted);margin:-6px 0 14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Maui · Hawaiʻi Island · 2026</div>
    <h1>夏威夷选点投票</h1>
    <div class="dates"><span>茂宜 <b>12/5–12/8</b></span><span>大岛 <b>12/8–12/13</b></span><span><b>6</b> 人</span></div>
    <a class="maplink" href="trip.html">看行程路线地图 →</a>
  </header>

  <div class="tabs" role="tablist">
    <button id="tab-vote" role="tab" aria-selected="true" aria-controls="vote">我来投</button>
    <button id="tab-res" role="tab" aria-selected="false" aria-controls="results">看结果<span class="count" id="voterCount"></span></button>
  </div>

  <section id="vote" role="tabpanel" aria-labelledby="tab-vote">
    <div class="mode" id="mode">正在连接…选的内容会先存在你这台设备上。</div>
    <div class="claim" id="claim" hidden></div>
    <div class="mine" id="mine" hidden></div>
    <div class="who">
      <label class="lbl" for="name">你的名字（填了才会保存）</label>
      <input type="text" id="name" placeholder="比如：小王" maxlength="20" autocomplete="nickname">
    </div>
    <div class="legend">
      <span><i class="sw s3"></i>必去</span>
      <span><i class="sw s2"></i>想去</span>
      <span><i class="sw s1"></i>随意</span>
      <span><i class="sw s0"></i>不去</span>
      <span><span style="color:var(--gold)">★</span>感兴趣程度，满分 5 星</span><span>每个地方都能点「留言」，危险或新消息可以标成 ⚠ 安全提醒</span>
    </div>
    <div id="copyout" class="copyout" hidden>
      <p id="copymsg">已复制，直接粘贴到群里。</p>
      <textarea id="copytext" readonly aria-label="报号内容"></textarea>
    </div>
    <div class="advice" id="advice" hidden></div>
    <div id="list"></div>
    <div class="notebox">
      <label class="lbl" for="note">还有什么想说的（可不填）</label>
      <textarea id="note" maxlength="500" placeholder="比如：Molokini 和 Sea Scooter 二选一就行；不想太早起"></textarea>
    </div>
  </section>

  <section id="results" role="tabpanel" aria-labelledby="tab-res" hidden>
    <div id="resBody"></div>
  </section>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="prog"><b id="progN">已选 0 / 25</b><small id="status">选完点右边按钮，发到群里</small></div>
    <button class="btn" id="copyBtn" type="button">复制报号</button>
  </div>
</div>

<script src="config.js"></script>
<script>
const PLACES=[

 {n:7,plan:{"k": "keep", "t": "12/7 上午，给不冲浪的人", "d": "d3"},i:'maui',name:'瀑布速降 Rappel Maui',d:'$240.84/人，3 小时',L:[["行程页", "https://www.to-hawaii.com/activities/maui/rappel-maui-waterfalls-and-rainforest-cliffs"]]},
 {n:8,plan:{"k": "drop", "t": "单程 2 小时多、要预约；黑沙滩和海龟改在大岛 Punaluʻu 看（12/9）", "d": "d5"},i:'maui',name:'Waiʻānapanapa 黑沙滩',d:'$5/人 + $10 停车，需提前预约',L:[["州立公园官网", "https://dlnr.hawaii.gov/dsp/parks/maui/waianapanapa-state-park"], ["预约 FAQ", "https://gostateparks.hawaii.gov/waianapanapa/faq"]]},

 {n:10,plan:{"k": "keep", "t": "12/8 去机场途中", "d": "d4"},i:'maui',name:'ʻĪao Valley',d:'需预约',L:[["官方预约", "https://gostateparks.hawaii.gov/iao-valley/about"]]},
 {n:11,plan:{"k": "keep", "t": "12/5 傍晚；12/7 傍晚想看可以再去", "d": "d1"},i:'maui',name:'Kam III 日落',L:[["Kam III 介绍", "https://www.themauiexpert.com/kamaole-beach-park-iii-kihei-maui"]]},
 {n:12,plan:{"k": "none", "t": "12/5–12/8 售罄，没排进行程", "d": ""},i:'maui',name:'Old Lahaina Luau',d:'12/5–8 只能排 waitlist 或换别的',flag:'warn',flagT:'已售罄',L:[["体验介绍", "https://www.hawaiiactivities.com/travelguide/old-lahaina-luau-what-to-expect/"]]},
 {n:13,plan:{"k": "none", "t": "已经有 Sea Scooter 浮潜，没排进行程", "d": ""},i:'maui',name:'Molokini 浮潜船',d:'约 $110–$180/人',L:[["示例：Kihei 2 小时船", "https://redlinerafting.com/tours/molokini-snorkeling-tours-two-hour-trip/"]]},
 {n:14,plan:{"k": "drop", "t": "已删", "d": ""},i:'maui',name:'Bike Maui 山顶骑行',d:'$238.59/人（备选 Sunriders $129–139，也没选）',flag:'del',flagT:'已删',L:[["行程页", "https://www.hawaiiactivities.com/en/hawaii/maui/a/156490"]]},
 {n:15,plan:{"k": "none", "t": "12 月初非旺季，没排进行程", "d": ""},i:'maui',name:'观鲸',d:'12 月初非旺季，看到的概率一般',L:[["Pacific Whale Foundation", "https://pacificwhale.org/whale-watch-maui/"]]},
 {n:16,plan:{"k": "keep", "t": "12/9；如果喷发窗口落在行程里，12/11 自由日可以再去", "d": "d5"},i:'big',name:'火山国家公园',d:'Crater Rim、Kīlauea Iki、Thurston 熔岩管、Chain of Craters，门票 $30/车',L:[["NPS 行前须知", "https://www.nps.gov/havo/planyourvisit/index.htm"]]},
 {n:17,plan:{"k": "change", "t": "换成 Kazumura 熔岩洞（12/9），在回 Hilo 的路上，少开约 4 小时", "d": "d5"},i:'big',name:'Kula Kai 熔岩洞',d:'$95/人，电话订（备选 Kazumura Cave $60 现金 / $65 刷卡）',L:[["Hawaii Magazine 介绍", "https://www.hawaiimagazine.com/you-can-traverse-through-lava-tubes-on-this-guide-tour/"]]},
 {n:18,plan:{"k": "keep", "t": "12/10 上午", "d": "d6"},i:'big',name:'Akaka Falls',L:[["州立公园官网", "https://dlnr.hawaii.gov/dsp/parks/hawaii/akaka-falls-state-park/"]]},
 {n:19,plan:{"k": "keep", "t": "12/10 上午", "d": "d6"},i:'big',name:'Hawaii 热带植物园',L:[["植物园介绍", "https://www.hawaii-guide.com/big-island/sights/hawaii_tropical_botanical_garden"]]},
 {n:20,plan:{"k": "keep", "t": "12/10 下午；12/11 自由日", "d": "d6"},i:'big',name:'Hilo 小镇',L:[["Go Hawaii：Hilo 市区", "https://www.gohawaii.com/islands/hawaii-big-island/regions/hilo/downtown-hilo"]]},
 {n:21,plan:{"k": "keep", "t": "12/13 上午，去机场路上", "d": "d9"},i:'big',name:'Greenwell Farms 咖啡园',L:[["农场参观", "https://www.greenwellfarms.com/kona-farm-tours-a/259.htm"]]},
 {n:22,plan:{"k": "keep", "t": "12/13 中午去机场路上走一圈；Two Step 浮潜可选放 12/12 下午", "d": "d9"},i:'big',name:'Puʻuhonua o Hōnaunau + Two Step 浮潜',L:[["NPS 介绍", "https://www.nps.gov/places/puuhonuaohonaunau.htm"]]},
 {n:23,plan:{"k": "opt", "t": "12/12 下午可选（早点出发去 Kona），去法 trail / kayak / boat tour 待定", "d": "d8"},i:'big',name:'Captain Cook 浮潜',d:'好，珊瑚棒；去法 trail / kayak / boat tour 待定',L:[["Go Hawaii：Kealakekua Bay", "https://www.gohawaii.com/islands/hawaii-big-island/regions/kona/kealakekua-bay"]]},
 {n:24,plan:{"k": "keep", "t": "12/10 傍晚，游客中心看日落和星空，不上山顶", "d": "d6"},i:'big',name:'Mauna Kea 观星',d:'只到游客中心，普通路、普通车就行；山顶不去（要四驱、必须老司机），注意高反',L:[["游客中心观星", "https://hilo.hawaii.edu/maunakea/visitor-information/stargazing"]]},
 {n:25,plan:{"k": "opt", "t": "12/12 傍晚 5:30（最轻松的一天），可选：想去的下水，不想下水的上船看或在 Kona 等", "d": "d8"},i:'big',name:'Iruka 魔鬼鱼夜潜',d:'约 $125/人',L:[["Iruka 行程评价", "https://hawaiiactivities.com/en/hawaii/big_island/a/167715/reviews"]]}
];
const ISLANDS=[{k:'maui',t:'茂宜 Maui',d:'12/5 – 12/8'},{k:'big',t:'大岛 Hawaiʻi',d:'12/8 – 12/13'}];
const LV={3:'必去',2:'想去',1:'随意',0:'不去'};
const LS='hawaii-vote-draft-v2';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('v'+Date.now().toString(36)+Math.random().toString(36).slice(2,12));
const newId=()=>rid().replace(/[^A-Za-z0-9-]/g,'').slice(0,20);
const fmtT=t=>{if(!t)return '';const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
const wTxt=w=>w!=null&&LV[w]?LV[w]:'未选';
const nameOf=v=>(v.name||'').trim()||'未署名';
const pname=n=>PLACES[n-1]?PLACES[n-1].name:'';

let st={name:'',votes:{},note:'',comments:[],t:0};
try{
  let d=JSON.parse(localStorage.getItem(LS)||'null');
  if(!d){
    const o=JSON.parse(localStorage.getItem('hawaii-vote-draft-v1')||'null');
    if(o){d={name:o.name||'',note:o.note||'',votes:{},comments:[],t:o.t||0};
      Object.keys(o.votes||{}).forEach(k=>{const v=o.votes[k]||{};if(v.w!=null||v.s)d.votes[k]={w:v.w,s:v.s||0};if((v.c||'').trim())d.comments.push({id:newId(),n:+k,x:v.c.trim(),risk:false,t:o.t||Date.now()});});}
  }
  if(d&&typeof d==='object')st=Object.assign(st,d);
}catch(e){}
if(!Array.isArray(st.comments))st.comments=[];

/* ---------- ballot ---------- */
const PLK={keep:'保留',opt:'可选',drop:'已删',none:'没排',change:'有改动'};
function planInner(p){
  const d=plan?planDecisions()[p.n]:null;
  const link=p.plan&&p.plan.d?` <a href="trip.html#${p.plan.d}">看路线 →</a>`:'';
  if(d){const k={keep:'keep',maybe:'opt',drop:'drop'}[d.k];
    return `<div class="pstat ${k}"><span class="pk">${d.t}</span><span class="pt"><b>第 ${esc(plan.round)} 轮取舍</b>${esc(d.why||'')}${d.k!=='drop'?link:''}</span></div>`;}
  if(!p.plan)return '';
  const k=p.plan.k;
  return `<div class="pstat ${k}"><span class="pk">${PLK[k]||''}</span><span class="pt"><b>新版行程</b>${esc(p.plan.t)}${link}</span></div>`;
}
const planLine=p=>`<div id="ps${p.n}">${planInner(p)}</div>`;
function paintPlanLines(){PLACES.forEach(p=>{const el=$('ps'+p.n);if(el)el.innerHTML=planInner(p);const a=$('p'+p.n);if(a){const D=plan&&planDecisions()[p.n];a.classList.toggle('plan-drop',D?D.k==='drop':!!(p.plan&&p.plan.k==='drop'));}});}
function rowHTML(p){
  const flags=(p.flag?`<span class="flag ${p.flag}">${p.flagT}</span>`:'')+(p.free?'<span class="flag free">免费</span>':'');
  const det=(flags||p.d)?`<p class="detail">${flags}${p.d?esc(p.d):''}</p>`:'';
  const links=(p.L||[]).map(([t,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join('');
  const seg=[3,2,1,0].map(w=>`<button type="button" data-w="${w}" aria-pressed="false">${LV[w]}</button>`).join('');
  const stars=[1,2,3,4,5].map(s=>`<button type="button" data-s="${s}" aria-label="${s} 星" aria-pressed="false">★</button>`).join('');
  return `<article class="place${p.flag==='del'?' deleted':''}${p.plan&&p.plan.k==='drop'?' plan-drop':''}" data-n="${p.n}" id="p${p.n}">
    <div class="num">${p.n}</div>
    <div class="body"><h3>${esc(p.name)}</h3>${det}${links?`<div class="links">${links}</div>`:''}
      ${planLine(p)}
      <div id="rk${p.n}"></div>
      <div class="ctrl"><div class="seg" role="group" aria-label="想去程度">${seg}</div>
      <div class="stars" role="group" aria-label="感兴趣程度，满分 5 星">${stars}</div>
      <button type="button" class="cbtn" id="cb${p.n}" data-c="1" aria-expanded="false" aria-controls="th${p.n}">留言</button></div>
      <div class="thread" id="th${p.n}" hidden>
        <ul class="cmlist" id="cl${p.n}"></ul>
        <div class="composer">
          <textarea class="cmt" id="c${p.n}" data-n="${p.n}" maxlength="300" rows="2" aria-label="给 ${p.n} 号留言" placeholder="对 ${p.n} 号的想法或新消息，比如：听说最近封路了"></textarea>
          <div class="cmp-row"><label class="rchk"><input type="checkbox" id="r${p.n}"> ⚠ 标成安全提醒</label><button type="button" class="btn sm" data-post="${p.n}">发表</button></div>
        </div>
      </div></div></article>`;
}
function buildList(){
  $('list').innerHTML=ISLANDS.map(is=>{
    const ps=PLACES.filter(p=>p.i===is.k);
    return `<section class="island"><div class="island-h"><h2>${is.t}</h2><span>${is.d} · ${ps[0].n}–${ps[ps.length-1].n} 号</span></div>${ps.map(rowHTML).join('')}</section>`;
  }).join('');
}
function commentsFor(n){
  const out=[];
  all.forEach(v=>{if(v.id===uid)return;(v.comments||[]).forEach(c=>{if(c.n===n)out.push(Object.assign({},c,{who:nameOf(v),mine:false}));});});
  st.comments.forEach(c=>{if(c.n===n)out.push(Object.assign({},c,{who:(st.name||'').trim()||'我',mine:true}));});
  return out.sort((a,b)=>(a.t||0)-(b.t||0));
}
function paintThread(n){
  const cs=commentsFor(n),risks=cs.filter(c=>c.risk);
  const shown=risks.concat(cs.filter(c=>!c.risk));
  const MAXV=4,rest=shown.length-MAXV;
  $('rk'+n).innerHTML=shown.length?`<div class="adv${risks.length?' has-risk':''}"><b class="adv-h">大家的建议</b><ul>${shown.slice(0,MAXV).map(c=>`<li class="${c.risk?'r':''}"><b>${esc(c.who)}</b>${c.risk?'<span class="rtag">⚠ 安全提醒</span>':''}<span>${esc(c.x)}</span></li>`).join('')}</ul>${rest>0?`<button type="button" class="linkbtn" data-c="1">还有 ${rest} 条，展开全部</button>`:''}</div>`:'';
  $('cl'+n).innerHTML=cs.length?cs.map(c=>`<li class="${c.risk?'r':''}${c.mine?' mine':''}"><div class="cm-h"><b>${esc(c.who)}</b>${c.risk?'<span class="rtag">⚠ 安全提醒</span>':''}<span class="cm-t">${c.t?fmtT(c.t):''}</span>${c.mine?`<button type="button" class="linkbtn" data-del="${esc(c.id)}">删除</button>`:''}</div><p>${esc(c.x)}</p></li>`).join(''):'<li class="none">还没有留言。</li>';
  const th=$('th'+n),cb=$('cb'+n),open=!th.hidden;
  cb.textContent=open?'收起':(cs.length?`写留言 · 共 ${cs.length} 条`:'写留言');
  cb.classList.toggle('has',cs.length>0);cb.classList.toggle('warn',risks.length>0);cb.setAttribute('aria-expanded',String(open));
}
function paintRow(n){
  const el=$('p'+n),v=st.votes[n]||{};
  el.classList.toggle('has',v.w!=null);
  el.classList.toggle('lv3',v.w===3);
  el.querySelectorAll('[data-w]').forEach(b=>b.setAttribute('aria-pressed',String(v.w===+b.dataset.w)));
  el.querySelectorAll('[data-s]').forEach(b=>{const on=(v.s||0)>=+b.dataset.s;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(v.s===+b.dataset.s));});
  paintThread(n);
}
function setVote(n,patch){
  const v=Object.assign({w:null,s:0},st.votes[n]||{},patch);
  if(v.w==null&&!v.s)delete st.votes[n];else st.votes[n]={w:v.w,s:v.s||0};
}
function renderAdvice(){
  const box=$('advice');if(!box)return;
  const items=[];
  all.forEach(v=>{if(v.id===uid)return;const who=nameOf(v);
    (v.comments||[]).forEach(c=>{if(c.n===0)items.push({who,x:c.x,risk:!!c.risk,t:c.t});});
    if((v.note||'').trim())items.push({who,x:v.note.trim(),t:v.updatedAt});});
  if(!items.length){box.hidden=true;return;}
  items.sort((a,b)=>(a.t||0)-(b.t||0));
  box.hidden=false;
  box.innerHTML=`<h3>大家的整体建议</h3><ul>${items.map(i=>`<li class="${i.risk?'r':''}"><b>${esc(i.who)}</b>${i.risk?'<span class="rtag">⚠ 安全提醒</span>':''}${esc(i.x)}</li>`).join('')}</ul><p>具体到每个地方的留言，在下面各个地方点「留言」看。</p>`;
}
function paintAll(){renderAdvice();PLACES.forEach(p=>paintRow(p.n));$('name').value=st.name||'';$('note').value=st.note||'';updateBar();renderMine();}

function postComment(n){
  const ta=$('c'+n),x=ta.value.trim();
  if(!x){ta.focus();return;}
  if(!(st.name||'').trim()){setStatus('先在上面填个名字再留言');$('name').focus();window.scrollTo({top:0,behavior:'smooth'});return;}
  st.comments.push({id:newId(),n,x:x.slice(0,300),risk:$('r'+n).checked,t:Date.now()});
  ta.value='';$('r'+n).checked=false;paintThread(n);changed(true);
}
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const n=+b.closest('.place').dataset.n;
  const v=st.votes[n]||{};
  if(b.dataset.c){const th=$('th'+n);th.hidden=!th.hidden;paintThread(n);if(!th.hidden)$('c'+n).focus();return;}
  if(b.dataset.post){postComment(n);return;}
  if(b.dataset.del){st.comments=st.comments.filter(c=>c.id!==b.dataset.del);paintThread(n);changed(true);return;}
  if(b.dataset.w!=null){const w=+b.dataset.w;setVote(n,{w:(v.w===w)?null:w});}
  if(b.dataset.s!=null){const s=+b.dataset.s;setVote(n,{s:(v.s===s)?0:s});}
  paintRow(n);changed();
});
$('list').addEventListener('keydown',e=>{
  const ta=e.target.closest('.cmt');if(!ta)return;
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();postComment(+ta.dataset.n);}
});
$('name').addEventListener('input',()=>{st.name=$('name').value;changed();});
$('note').addEventListener('input',()=>{st.note=$('note').value;changed();});

function picked(){return Object.values(st.votes).filter(v=>v.w!=null).length;}
function updateBar(){
  $('progN').textContent=`已选 ${picked()} / ${PLACES.length}`;
  const noName=!(st.name||'').trim()&&(picked()>0||st.comments.length>0);
  document.body.classList.toggle('noname',noName);
  $('copyBtn').textContent=noName&&API?'填名字保存':'复制报号';
  if(noName&&API)setStatus('还没保存：先在最上面填名字');
}

/* ---------- my ballot: edit / reset / delete ---------- */
let pendingAct=null;
function renderMine(){
  const box=$('mine');if(!box)return;
  const mine=all.find(v=>v.id===uid);
  if(!API||(!mine&&!picked()&&!st.comments.length)){box.hidden=true;return;}
  box.hidden=false;
  let html=`<div class="mine-h"><b>${mine?`你 ${fmtT(mine.updatedAt)} 保存过`:'还没保存到投票表'}</b><span>选了 ${picked()} 个 · 留言 ${st.comments.length} 条</span></div>
    <p>想改直接点下面的选项，改完自动保存，不会留下改动记录。听说哪里危险或有新消息，就在那个地方点「留言」，勾上「⚠ 标成安全提醒」。</p>`;
  if(pendingAct==='reset'){
    html+=`<div class="confirm"><p>清空你在 25 个地方的选择和星数，留言保留。</p><div class="mine-act"><button type="button" class="btn sm" data-confirm="reset">确定清空</button><button type="button" class="btn ghost sm" data-cancel="1">取消</button></div></div>`;
  }else if(pendingAct==='delete'){
    html+=`<div class="confirm danger"><p>删除你的整份投票，包括选择、星数和留言，删了找不回来。</p><div class="mine-act"><button type="button" class="btn sm danger" data-confirm="delete">确定删除</button><button type="button" class="btn ghost sm" data-cancel="1">取消</button></div></div>`;
  }else{
    html+=`<div class="mine-act"><button type="button" class="btn ghost sm" data-act="reset">清空重投</button><button type="button" class="btn ghost sm danger" data-act="delete">删除我的投票</button></div>`;
  }
  box.innerHTML=html;
}
$('mine').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act){pendingAct=b.dataset.act;renderMine();return;}
  if(b.dataset.cancel){pendingAct=null;renderMine();return;}
  if(b.dataset.confirm==='reset')doReset();
  if(b.dataset.confirm==='delete')doDelete();
});
async function doReset(){
  pendingAct=null;clearTimeout(timer);
  st.votes={};st.t=Date.now();persistLocal();paintAll();
  if(API&&all.find(v=>v.id===uid)){
    setStatus('正在清空…');
    try{await apiPost({action:'reset',id:uid});setStatus('已清空，可以重新投了');}catch(e){setStatus('清空没成功，检查网络后再试');}
  }else setStatus('已清空，可以重新投了');
  await refresh();
  $('list').scrollIntoView({behavior:'smooth',block:'start'});
}
async function doDelete(){
  pendingAct=null;clearTimeout(timer);
  const oldId=uid;
  st.votes={};st.comments=[];st.note='';st.t=Date.now();
  uid=rid();try{localStorage.setItem(ID_KEY,uid);}catch(e){}
  persistLocal();paintAll();
  if(API){
    setStatus('正在删除…');
    try{await apiPost({action:'delete',id:oldId});setStatus('已删除。想重新投，直接点选项就行');}catch(e){setStatus('删除没成功，检查网络后再试');}
  }
  await refresh();
}

/* ---------- copy 报号 ---------- */
function reportText(){
  const nm=(st.name||'').trim()||'（没写名字）';
  const lines=[`【夏威夷投票】${nm}`];
  const fmt=p=>{const v=st.votes[p.n];return `${p.n} ${p.name}${v.s?' ★'+v.s:''}`;};
  [3,2,1,0].forEach(w=>{
    const ps=PLACES.filter(p=>st.votes[p.n]&&st.votes[p.n].w===w);
    if(ps.length)lines.push(`${LV[w]}：${ps.map(fmt).join('；')}`);
  });
  const only=PLACES.filter(p=>st.votes[p.n]&&st.votes[p.n].w==null&&st.votes[p.n].s);
  if(only.length)lines.push(`只打分：${only.map(fmt).join('；')}`);
  if(lines.length===1)lines.push('（还没选）');
  st.comments.slice().sort((a,b)=>a.n-b.n||(a.t||0)-(b.t||0)).forEach(c=>lines.push(`${c.risk?'⚠ ':''}${c.n} 号${c.risk?' 安全提醒':' 留言'}：${c.x}`));
  if((st.note||'').trim())lines.push(`备注：${st.note.trim()}`);
  return lines.join('\n');
}
$('copyBtn').addEventListener('click',async()=>{
  if(!(st.name||'').trim()){showTab('vote');window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>$('name').focus(),350);setStatus('先在最上面填名字，填完自动保存');return;}
  const t=reportText();
  $('copytext').value=t;$('copyout').hidden=false;
  try{await navigator.clipboard.writeText(t);$('copymsg').textContent='已复制，直接粘贴到群里。';}
  catch(e){$('copymsg').textContent='没法自动复制，长按下面的文字全选后复制。';$('copytext').focus();$('copytext').select();}
  showTab('vote');$('copyout').scrollIntoView({behavior:'smooth',block:'center'});
});

/* ---------- shared store: Google Sheet via Apps Script web app ---------- */
const API=((window.VOTE_CONFIG&&window.VOTE_CONFIG.apiUrl)||'').trim();
const ID_KEY='hawaii-vote-id';
let uid=null;
try{uid=localStorage.getItem(ID_KEY);}catch(e){}
if(!uid){uid=rid();try{localStorage.setItem(ID_KEY,uid);}catch(e){}}
let all=[],loaded=false,loadErr=false,restored=false,plan=null;
let timer=null,saving=false,again=false;

function setStatus(s){$('status').textContent=s;}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(st));}catch(e){}}
function changed(now){st.t=Date.now();persistLocal();updateBar();renderMine();if($('copyout').hidden===false)$('copytext').value=reportText();schedule(now);}

async function apiGet(){
  const r=await fetch(API+(API.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(!j||!j.ok)throw new Error((j&&j.error)||'bad response');
  return Array.isArray(j.votes)?j.votes:[];
}
async function apiPost(body){
  // text/plain avoids a CORS preflight, which Apps Script cannot answer
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  const j=await r.json();
  if(!j||!j.ok)throw new Error((j&&j.error)||'save failed');
  return j;
}

function schedule(now){
  if(!API)return;
  if(!(st.name||'').trim()){setStatus('填上名字后自动保存');return;}
  clearTimeout(timer);
  if(checkClaim()){setStatus('这个名字已经有一份投票：先点上面的「载入并合并」，或者换个名字');return;}
  setStatus('有改动，马上保存…');timer=setTimeout(save,now?0:1200);
}
async function save(){
  if(!all.find(v=>v.id===uid)&&checkClaim()){return;}
  if(saving){again=true;return;}
  saving=true;setStatus('保存中…');
  try{
    await apiPost({action:'vote',id:uid,name:st.name.trim().slice(0,20),votes:st.votes,note:(st.note||'').slice(0,500),
      comments:st.comments.map(c=>({id:c.id,n:c.n,x:c.x,risk:!!c.risk}))});
    setStatus('已保存，结果页能看到');
    refresh();
  }catch(e){
    setStatus('保存没成功，检查网络后再改一下会重试；也可以「复制报号」');
  }
  saving=false;if(again){again=false;save();}
}
function fromServer(v){
  const votes={};Object.keys(v.votes||{}).forEach(k=>{const x=v.votes[k];if(x&&(x.w!=null||x.s))votes[k]={w:x.w,s:x.s||0};});
  return {votes,comments:(v.comments||[]).map(c=>({id:c.id,n:c.n,x:c.x,risk:!!c.risk,t:c.t}))};
}
async function refresh(){
  if(!API)return;
  try{
    all=await apiGet();loaded=true;loadErr=false;
    const mine=all.find(v=>v.id===uid);
    if(!restored){
      restored=true;
      if(mine&&(mine.updatedAt||0)>(st.t||0)){
        const f=fromServer(mine);
        st.name=mine.name||st.name;st.votes=f.votes;st.comments=f.comments;st.note=mine.note||'';st.t=mine.updatedAt;
        persistLocal();
      }
    }
    if(mine){const byId={};(mine.comments||[]).forEach(c=>byId[c.id]=c);st.comments.forEach(c=>{if(byId[c.id])c.t=byId[c.id].t;});}
    checkClaim();
  }catch(e){loadErr=true;}
  paintAll();renderResults();
}
async function loadPlan(){
  try{
    const r=await fetch('plan.json?t='+Date.now(),{cache:'no-store'});
    if(r.ok){const j=await r.json();plan=(j&&j.round)?j:null;}
  }catch(e){}
  paintPlanLines();renderResults();
}

/* Same name already voted from another device: offer to continue that ballot. */
function checkClaim(){
  const box=$('claim');
  const nm=(st.name||'').trim().toLowerCase();
  const mine=all.find(v=>v.id===uid);
  const other=nm&&!mine?all.find(v=>v.id!==uid&&(v.name||'').trim().toLowerCase()===nm):null;
  if(!other){box.hidden=true;return null;}
  if(!box.hidden&&box.dataset.for===other.id)return other;
  box.hidden=false;box.innerHTML='';box.dataset.for=other.id;
  const p=document.createElement('p');
  p.textContent=`「${other.name}」已经有一份投票（可能是在别的手机或电脑上，或者别人帮你转贴的留言）。是你的话，点下面载入，这台设备上刚选的和写的会合并进去，不会多出一个人。`;
  const b=document.createElement('button');b.type='button';b.className='btn';b.textContent='载入并合并';
  b.addEventListener('click',()=>{
    uid=other.id;try{localStorage.setItem(ID_KEY,uid);}catch(e){}
    const f=fromServer(other);
    // Keep anything picked or written on this device before loading.
    const votes=Object.assign({},f.votes,st.votes);
    const seen=new Set(f.comments.map(c=>c.n+'|'+c.x.trim()));
    const extra=st.comments.filter(c=>!seen.has(c.n+'|'+c.x.trim()));
    const merged=Object.keys(st.votes).length+extra.length>0;
    st.name=other.name||st.name;st.votes=votes;st.comments=f.comments.concat(extra);
    st.note=[other.note||'',(st.note||'').trim()].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join('\n');
    st.t=Date.now();persistLocal();paintAll();box.hidden=true;
    if(merged){changed(true);setStatus('已载入，并把这台设备上的选择和留言合并进去');}else setStatus('已载入，之后的改动会保存到这一份');
  });
  const b2=document.createElement('button');b2.type='button';b2.className='btn ghost';b2.textContent='不是我，换个名字';
  b2.addEventListener('click',()=>{$('name').focus();$('name').select();});
  const row=document.createElement('div');row.className='mine-act';row.append(b,b2);
  box.append(p,row);
  box.scrollIntoView({behavior:'smooth',block:'center'});
  return other;
}

function setMode(){
  const m=$('mode');
  if(API){m.innerHTML='<strong>选的会自动保存，随时可以改</strong>。所有人能在「看结果」里看到汇总、留言和谁改了什么。也可以点「复制报号」发群里。';}
  else{m.innerHTML='投票表还没接上。<strong>选完点右下角「复制报号」</strong>，粘贴到群里就行。';}
}
function init(){
  setMode();loadPlan();
  if(!API){renderResults();return;}
  refresh();
  setInterval(()=>{if(document.visibilityState==='visible'&&!saving)refresh();},30000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){refresh();loadPlan();}});
}

/* ---------- daily trade-off plan (written by Claude each evening) ---------- */
const DEC={keep:'保留',maybe:'待定',drop:'砍掉'};
function planDecisions(){
  const o={};
  if(plan&&Array.isArray(plan.items))plan.items.forEach(it=>{
    const n=+it.n,k=DEC[it.decision]?it.decision:'maybe';
    if(n>=1&&n<=PLACES.length)o[n]={k,t:DEC[k],why:typeof it.why==='string'?it.why:''};
  });
  return o;
}
function planHTML(){
  if(!plan)return `<div class="plan empty-plan"><div class="plan-h"><h2>每日取舍</h2></div><p>每天傍晚 6 点前后，Claude 会收集大家的选择和留言，按可行性、花费、好玩程度和时间安排做取舍，并写明理由，显示在这里。</p></div>`;
  const when=plan.updatedAt?new Date(plan.updatedAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  const D=planDecisions();
  const group=k=>Object.keys(D).filter(n=>D[n].k===k).sort((a,b)=>a-b);
  const line=k=>{const ns=group(k);return ns.length?`<div class="plan-row ${k}"><span class="tag">${DEC[k]}</span><span>${ns.map(n=>`${n} ${esc(PLACES[n-1].name)}`).join('；')}</span></div>`:'';};
  const days=Array.isArray(plan.days)?plan.days.filter(d=>d&&d.label).map(d=>`<li><b>${esc(d.label)}</b>${esc(d.text||'')}</li>`).join(''):'';
  return `<div class="plan"><div class="plan-h"><h2>每日取舍${plan.round?` · 第 ${esc(plan.round)} 轮`:''}</h2><span>${esc(when)}</span></div>
    ${plan.summary?`<p class="plan-sum">${esc(plan.summary)}</p>`:''}
    ${line('keep')}${line('maybe')}${line('drop')}
    ${days?`<ul class="plan-days">${days}</ul>`:''}
    ${plan.ask?`<p class="plan-ask"><b>需要大家回答：</b>${esc(plan.ask)}</p>`:''}
    <p class="plan-foot">每个地方被保留或砍掉的理由，写在下面对应的条目里。</p></div>`;
}

/* ---------- results ---------- */
function feedHTML(){
  const ev=[];
  all.forEach(v=>{const who=esc(nameOf(v));
    (v.comments||[]).forEach(c=>ev.push({t:c.t,cls:c.risk?'risk':'',html:`<b>${who}</b> ${c.risk?'<span class="rtag">⚠ 安全提醒</span>':'留言'} ${c.n?`${c.n} 号 ${esc(pname(c.n))}`:''}：${esc(c.x)}`}));
  });
  if(!ev.length)return '';
  ev.sort((a,b)=>(b.t||0)-(a.t||0));
  return `<div class="feed"><h3>最新留言<small>共 ${ev.length} 条${ev.length>5?'，框里可以上下滑':''}</small></h3><ul>${ev.map(e=>`<li class="${e.cls}"><span class="ft">${fmtT(e.t)}</span><span class="fx">${e.html}</span></li>`).join('')}</ul></div>`;
}
function renderResults(){
  const box=$('resBody');
  const voters=all.filter(v=>v.votes&&Object.keys(v.votes).length);
  $('voterCount').textContent=voters.length?String(voters.length):'';
  const D=planDecisions();
  const planBox=planHTML();
  if(!API){box.innerHTML=planBox+'<div class="empty">投票表还没接上，看不到汇总。<br>大家先用「复制报号」把结果发到群里。</div>';return;}
  if(!loaded){box.innerHTML=planBox+'<div class="empty">'+(loadErr?'汇总读取失败，稍后会自动重试。':'正在读取大家的投票…')+'</div>';return;}
  const mine=all.find(v=>v.id===uid);
  const editBtn=mine?`<div class="editbar"><span>你 ${fmtT(mine.updatedAt)} 保存过</span><button type="button" class="btn ghost sm" id="editMine">改我的选择</button></div>`:'';
  const feed=feedHTML();
  if(!voters.length){box.innerHTML=planBox+editBtn+feed+'<div class="empty">还没有人保存。<br>有人在「我来投」里选完后，这里会按岛实时排出名次，留言也会列在每个地方下面。</div>';return;}
  const N=voters.length;
  const stats=PLACES.map(p=>{
    const c={3:[],2:[],1:[],0:[]};let ss=0,sn=0;const cm=[];
    voters.forEach(v=>{const x=v.votes[p.n];if(!x)return;if(x.w!=null&&c[x.w])c[x.w].push(nameOf(v));if(x.s){ss+=x.s;sn++;}});
    all.forEach(v=>{
      (v.comments||[]).forEach(cc=>{if(cc.n===p.n)cm.push({who:nameOf(v),x:cc.x,risk:!!cc.risk,t:cc.t});});
    });
    cm.sort((a,b)=>(a.t||0)-(b.t||0));
    return Object.assign({},p,{c,avg:sn?ss/sn:0,sn,cm});
  });
  const rank=(a,b)=>(b.c[3].length-a.c[3].length)||(b.c[2].length-a.c[2].length)||(b.avg-a.avg)||(a.c[0].length-b.c[0].length)||(a.n-b.n);
  let html=planBox+editBtn+feed+`<div class="voters">${voters.map(v=>`<span class="chip">${esc(nameOf(v))} · 选了 ${Object.values(v.votes).filter(x=>x.w!=null).length}</span>`).join('')}</div>
  <div class="rlegend" aria-label="条形图颜色"><span><i class="sw s3"></i>必去</span><span><i class="sw s2"></i>想去</span><span><i class="sw s1"></i>随意</span><span><i class="sw s0"></i>不去</span><span><i class="sw none"></i>没选</span></div>
  <p class="sortnote">排序：必去人数 → 想去人数 → 平均星数。</p>`;
  ISLANDS.forEach(is=>{
    const rows=stats.filter(s=>s.i===is.k).sort(rank);
    html+=`<section class="island"><div class="island-h"><h2>${is.t}</h2><span>${is.d}</span></div>`;
    rows.forEach((s,idx)=>{
      const seg=[3,2,1,0].map(w=>s.c[w].length?`<i class="s${w}" style="width:${s.c[w].length/N*100}%"></i>`:'').join('');
      const meta=[3,2,1,0].map(w=>`${LV[w]} ${s.c[w].length}`).join(' · ');
      const risks=s.cm.filter(x=>x.risk);
      const extra=(risks.length?`<div class="risk"><b>⚠ 安全提醒 ${risks.length} 条</b>${risks.map(x=>`<span>${esc(x.who)}：${esc(x.x)}</span>`).join('')}</div>`:'')
        +(s.c[3].length?`<div class="r-meta">必去：<span class="must">${s.c[3].map(esc).join('、')}</span></div>`:'')
        +(D[s.n]?`<div class="dec ${D[s.n].k}"><b>${D[s.n].t}</b>${D[s.n].why?esc(D[s.n].why):''}</div>`:'')
        +(s.cm.filter(x=>!x.risk).length?`<ul class="cms">${s.cm.filter(x=>!x.risk).map(x=>`<li><b>${esc(x.who)}</b>${esc(x.x)}<span class="cm-t">${fmtT(x.t)}</span></li>`).join('')}</ul>`:'');
      const sc=s.sn?`<span class="r-score">★ ${s.avg.toFixed(1)} <small style="color:var(--muted);font-weight:500">(${s.sn})</small></span>`:'<span class="r-score none">未打分</span>';
      html+=`<div class="r-row${idx<3&&s.c[3].length?' top':''}"><div class="num">${s.n}</div><div class="r-body">
        <div class="r-head"><h3>${esc(s.name)}${s.flag?` <span class="flag ${s.flag}">${s.flagT}</span>`:''}</h3>${sc}</div>
        <div class="stack" role="img" aria-label="${meta}">${seg}</div><div class="r-meta">${meta}</div>${extra}</div></div>`;
    });
    html+='</section>';
  });
  box.innerHTML=html;
}
$('resBody').addEventListener('click',e=>{
  if(e.target.closest('#editMine')){showTab('vote');$('mine').scrollIntoView({behavior:'smooth',block:'center'});}
});

/* ---------- tabs ---------- */
function showTab(k){
  const v=k==='vote';
  $('vote').hidden=!v;$('results').hidden=v;
  $('tab-vote').setAttribute('aria-selected',String(v));$('tab-res').setAttribute('aria-selected',String(!v));
}
$('tab-vote').addEventListener('click',()=>showTab('vote'));
$('tab-res').addEventListener('click',()=>{showTab('res');renderResults();});

buildList();paintAll();renderResults();setMode();
init();
</script>
