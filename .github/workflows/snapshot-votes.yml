name: Snapshot votes

# Copies the current votes from the Google Sheet into data/votes.json
# so the daily trade-off round can read them from the repo.
# 01:30 UTC = 17:30 Pacific (standard time, Nov–Mar).

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch votes
        run: |
          API=$(sed -n 's/.*apiUrl: *"\([^"]*\)".*/\1/p' site/config.js)
          if [ -z "$API" ]; then
            echo "apiUrl is empty in site/config.js — nothing to fetch."
            exit 0
          fi
          curl -fsSL "$API" -o /tmp/raw.json
          jq -e '.ok == true' /tmp/raw.json > /dev/null
          jq '{votes: (.votes | sort_by(.id))}' /tmp/raw.json > data/votes.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/votes.json
          if git diff --cached --quiet; then
            echo "No new votes."
          else
            git commit -m "Snapshot votes $(date -u +%Y-%m-%d)"
            git push
          fi
