name: Build routes

# Recomputes driving routes (routes.json) whenever trip-data.js changes.

on:
  push:
    branches: [main]
    paths: ["trip-data.js", "scripts/build-routes.mjs"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-routes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build routes.json
        run: node scripts/build-routes.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add routes.json
          if git diff --cached --quiet; then
            echo "Routes unchanged."
          else
            git commit -m "Update driving routes"
            git pull --rebase origin main
            git push
          fi
